kind = "web"
previewPath = "/"
title = "SpotJiggy"
version = "1.0.0"
id = "artifacts/spotjiggy"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20939

[services.development]
run = "pnpm --filter @workspace/spotjiggy run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/spotjiggy", "run", "build" ]
publicDir = "artifacts/spotjiggy/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20939"
BASE_PATH = "/"
